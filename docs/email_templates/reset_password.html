<!--
  Supabase → Authentication → Emails → Templates → Reset Password
  Шаблон письма сброса пароля: ТОЛЬКО код ({{ .Token }}), без ссылки.
  Ссылку убрали намеренно — её прокликивает сканер почты (токен гаснет),
  плюс {{ .ConfirmationURL }} вёл на битый http://IP. Сброс идёт по коду:
  на сайте «Забыли пароль?» → ввод этого кода → новый пароль.
-->
<h2>Сброс пароля</h2>
<p>Ваш код для сброса пароля:</p>
<p style="font-size:32px;font-weight:bold;letter-spacing:4px;color:#2e7d32">{{ .Token }}</p>
<p>Вернитесь на страницу входа, нажмите «Забыли пароль?»,
   введите этот код и задайте новый пароль.</p>
<p style="color:#888;font-size:12px">Если вы не запрашивали сброс — проигнорируйте письмо.</p>
